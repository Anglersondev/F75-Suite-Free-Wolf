# Builds the macOS app and .dmg on GitHub's macOS runners, for when no Mac is at hand.
# Run it from the Actions tab to get the .dmg as an artifact. When a Release is published,
# the .dmg is also attached to that Release automatically.
name: Build F75 Studio for Mac
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    paths: ['mac/**', '.github/workflows/build-mac.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: F75-Studio-1.0-mac
          path: mac/build/F75-Studio-1.0.dmg
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/F75-Studio-1.0.dmg --clobber
